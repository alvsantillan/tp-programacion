<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar | Admin Claudette</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">

 
  <link rel="stylesheet" href="../css/custom.css">
  <link rel="stylesheet" href="../css/admin-custom.css">
</head>

<body>

  
  <main class="pantalla-login min-vh-100 d-flex align-items-center justify-content-center p-3">

    <div class="card border-0 shadow-sm rounded-4 w-100" style="max-width: 420px;">
      <div class="card-body p-4 p-md-5 text-center">

        <a href="../index.html">
          <img src="../img/ui/logo.jpeg" alt="Claudette" width="110" class="rounded-3 mb-4">
        </a>

        <h1 class="titulo h3 fw-bold text-bordo mb-2">Panel de administracion</h1>
        <p class="text-secondary small mb-4">Ingresa con tu usuario para gestionar la tienda.</p>

        <form action="productos.html" method="get" class="text-start">

          <div class="mb-3">
            <label class="form-label fw-semibold" for="usuario">Usuario o email</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
              <input class="form-control" type="text" id="usuario" name="usuario" placeholder="claudia" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" for="clave">Contrasena</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
              <input class="form-control" type="password" id="clave" name="clave" placeholder="Tu contrasena" required>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="recordar" name="recordar" value="si">
            <label class="form-check-label small" for="recordar">Mantener la sesion iniciada</label>
          </div>

          <button class="btn btn-primary w-100 py-2" type="submit">
            <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
          </button>

        </form>

        <hr class="my-4">

        <a class="text-secondary text-decoration-none small" href="../index.html">
          <i class="bi bi-arrow-left me-1"></i>Volver al sitio
        </a>

      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
